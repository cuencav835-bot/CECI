name: Publicar CECI en GitHub Pages

on:
  push:
    branches:
      - claude/exciting-carson-mz4039
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - run: cp dist/ceci/browser/index.html dist/ceci/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ceci/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
